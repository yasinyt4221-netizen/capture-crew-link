<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070101" />
  <meta
    name="description"
    content="Capture Crew links."
  />
  <meta property="og:title" content="Capture Crew" />
  <meta
    property="og:description"
    content="Chat with Capture Crew or visit the website."
  />
  <meta property="og:type" content="website" />
  <title>Capture Crew</title>
  <link rel="preload" as="image" href="assets/capture-crew-wordmark-960.png" />
  <link rel="preload" as="image" href="assets/capture-crew-black-red-hero.jpg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <div class="particles" aria-hidden="true"></div>

  <div class="page">
    <header class="brand reveal" style="--delay: 60ms">
      <a class="brand-link" id="brandWebsiteLink" href="#" target="_blank" rel="noopener noreferrer" aria-label="Capture Crew website">
        <img src="assets/capture-crew-wordmark-960.png" width="960" height="185" alt="Capture Crew" decoding="async" />
      </a>
    </header>

    <main class="hero" id="main">
      <section class="hero-panel link-panel" aria-label="Capture Crew links">
        <div class="actions reveal" style="--delay: 140ms" aria-label="Primary links">
          <a class="cta cta-whatsapp" id="whatsappLink" href="#" target="_blank" rel="noopener noreferrer">
            <span class="icon-3d icon-whatsapp" aria-hidden="true">
              <img src="assets/icon-whatsapp-3d.svg" width="56" height="56" alt="" decoding="async" />
            </span>
            <span class="cta-copy">
              <span class="cta-label">CHAT ON WHATSAPP</span>
            </span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
              </svg>
            </span>
          </a>

          <a class="cta cta-site" id="websiteLink" href="#" target="_blank" rel="noopener noreferrer">
            <span class="icon-3d icon-website" aria-hidden="true">
              <img src="assets/icon-website-3d.svg" width="56" height="56" alt="" decoding="async" />
            </span>
            <span class="cta-copy">
              <span class="cta-label">VISIT WEBSITE</span>
            </span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14"></path>
                <path d="m13 6 6 6-6 6"></path>
              </svg>
            </span>
          </a>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
